[package]
name = "sshbool"
version.workspace = true
edition.workspace = true
description = "SSHBool — Infrastructure Workspace"

[workspace]
resolver = "2"
members = [".", "crates/application", "crates/domain", "crates/infrastructure"]

[workspace.package]
version = "0.1.3"
authors = ["SSHBool"]
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
anyhow = "1"
application = { path = "crates/application" }
async-trait = "0.1"
domain = { path = "crates/domain" }
infrastructure = { path = "crates/infrastructure" }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = { version = "1", features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "sshbool_lib"

[dependencies]
application = { workspace = true }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
domain = { workspace = true }
ed25519-dalek = { version = "2", features = ["std"] }
gethostname = "1"
hex = "0.4"
infrastructure = { workspace = true }
rand = "0.8"
regex = "1"
reqwest = {
  version = "0.12",
  default-features = false,
  features = ["json", "rustls-tls"]
}
russh = {
  version = "0.62",
  default-features = false,
  features = ["flate2", "ring", "rsa"]
}
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
ssh-key = {
  version = "0.6",
  features = ["alloc", "ecdsa", "ed25519", "encryption", "rsa"]
}
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
